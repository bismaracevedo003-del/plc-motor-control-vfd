<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0b1220"/>
  <text x="30" y="42" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold">Control circuit</text>
  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">
    <rect x="50" y="80" width="700" height="90" rx="8" fill="#111c2f" stroke="#1e293b"/>
    <text x="68" y="108">+24 V → F3 → S1 E-stop (NC) → F2 overload (NC) → PLC I0.0 / I0.1</text>
    <text x="68" y="140">S2 Start (I0.5) · S3 Stop (I0.6) · S4 Local/Remote (I0.4)</text>
    <rect x="50" y="195" width="700" height="90" rx="8" fill="#111c2f" stroke="#1e293b"/>
    <text x="68" y="223">PLC Q0.0 → K1 relay → KM1 line contactor coil</text>
    <text x="68" y="255">PLC QW80 → VFD speed reference 4-20 mA (0-50 Hz)</text>
    <rect x="50" y="310" width="700" height="60" rx="8" fill="#1a1424" stroke="#7f1d1d"/>
    <text x="68" y="346" fill="#fca5a5">E-stop interrupts the contactor coil independently of PLC software</text>
  </g>
</svg>
