<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#0b1220"/>
  <text x="32" y="46" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="3">PLC · MOTOR CONTROL</text>
  <text x="32" y="80" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">VFD Motor Station</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="32" y="110" width="836" height="110" rx="10" fill="#111c2f" stroke="#1e293b"/>
    <text x="52" y="140" fill="#94a3b8" font-size="12">STATE</text><text x="252" y="140" fill="#94a3b8" font-size="12">FREQUENCY</text>
    <text x="452" y="140" fill="#94a3b8" font-size="12">CURRENT</text><text x="652" y="140" fill="#94a3b8" font-size="12">FAULT</text>
    <text x="52" y="185" fill="#6ee7b7" font-size="26" font-weight="bold">RUNNING</text>
    <text x="252" y="185" fill="#e2e8f0" font-size="26" font-weight="bold">35.0 Hz</text>
    <text x="452" y="185" fill="#e2e8f0" font-size="26" font-weight="bold">4.20 A</text>
    <text x="652" y="185" fill="#94a3b8" font-size="26" font-weight="bold">none</text>
    <rect x="32" y="238" width="836" height="130" rx="10" fill="#111c2f" stroke="#1e293b"/>
    <text x="52" y="268" fill="#e2e8f0" font-size="14" font-weight="bold">Operator commands</text>
    <rect x="52" y="290" width="110" height="42" rx="6" fill="#064e3b" stroke="#34d399"/><text x="84" y="317" fill="#d1fae5" font-size="14">START</text>
    <rect x="176" y="290" width="110" height="42" rx="6" fill="#7f1d1d" stroke="#f87171"/><text x="211" y="317" fill="#fee2e2" font-size="14">STOP</text>
    <rect x="300" y="290" width="150" height="42" rx="6" fill="#1e293b" stroke="#334155"/><text x="317" y="317" fill="#e2e8f0" font-size="14">RESET FAULT</text>
    <text x="490" y="317" fill="#94a3b8" font-size="13">Setpoint 35 Hz · ramp 5 / 7 Hz/s</text>
    <rect x="32" y="386" width="836" height="104" rx="10" fill="#111c2f" stroke="#1e293b"/>
    <text x="52" y="416" fill="#e2e8f0" font-size="14" font-weight="bold">Fault simulation</text>
    <g fill="#e2e8f0" font-size="12">
      <rect x="52" y="436" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155"/><text x="73" y="458">Overload</text>
      <rect x="176" y="436" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155"/><text x="194" y="458">VFD fault</text>
      <rect x="300" y="436" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155"/><text x="316" y="458">Cooling</text>
      <rect x="424" y="436" width="110" height="34" rx="5" fill="#1e293b" stroke="#334155"/><text x="443" y="458">E-stop</text>
    </g>
  </g>
</svg>
